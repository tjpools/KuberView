# Sample workloads for KuberView to visualize.
# Apply with: kubectl apply -f manifests/demo-apps.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
# A classic web deployment: 3 nginx replicas behind a ClusterIP service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: demo
  labels:
    app: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: demo
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
---
# A tiny "worker" that logs a heartbeat, so logs are interesting to view
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heartbeat
  namespace: demo
  labels:
    app: heartbeat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: heartbeat
  template:
    metadata:
      labels:
        app: heartbeat
    spec:
      containers:
        - name: heartbeat
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - while true; do echo "$(date) heartbeat from $HOSTNAME"; sleep 5; done
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
---
# A CronJob so there's a third workload kind to explore
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tick
  namespace: demo
spec:
  schedule: "*/2 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: tick
              image: busybox:1.36
              command: ["/bin/sh", "-c", "echo tick $(date)"]
